
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PillRemind | Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <div class="brand-icon">✚</div>
      <h1>PillRemind</h1>
      <p class="subtitle">Your health, one reminder at a time.</p>

      <h2>Welcome Back</h2>
      <p class="description">Log in to your account to continue.</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button
            class="toggle-password"
            type="button"
            data-toggle-password="password"
          >Show</button>
        </div>

        <button class="forgot-link" id="forgotPassword" type="button">
          Forgot password?
        </button>

        <p id="formMessage" class="message" role="status" aria-live="polite"></p>

        <button class="primary-button" id="submitButton" type="submit">
          Log In
        </button>
      </form>

      <p class="switch-page">
        Don't have an account?
        <a href="signup.html">Create an account</a>
      </p>
    </section>
  </main>
</body>
</html>
