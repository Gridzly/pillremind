
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medminder Emulator Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      color: #173d2b;
      background: #f2f7f3;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 14px;
    }
    button {
      padding: 12px 16px;
      margin: 6px 4px 6px 0;
      border: 0;
      border-radius: 8px;
      background: #175638;
      color: white;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eef4ef;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Medminder Emulator Test</h1>
    <p>This page tests the separate emulator configuration.</p>

    <button id="testDatabase">Test Database</button>
    <button id="testFunctions">Test Functions</button>

    <pre id="output">Ready to test.</pre>
  </main>

  <script type="module">
    import { db, functions } from "./js/firebaseConfig.emulator.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { httpsCallable } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js";

    const output = document.getElementById("output");

    document.getElementById("testDatabase").addEventListener("click", async () => {
      output.textContent = "Testing database...";
      try {
        await get(ref(db, ".info/connected"));
        output.textContent =
          "Database request completed. Check the browser console if the connection is still unclear.";
      } catch (error) {
        output.textContent = "Database error: " + error.message;
        console.error(error);
      }
    });

    document.getElementById("testFunctions").addEventListener("click", async () => {
      output.textContent =
        "Function endpoint configured. Sign-in is required to test protected functions.";
      try {
        const getConnections = httpsCallable(functions, "getMyConnections");
        await getConnections();
      } catch (error) {
        output.textContent =
          "Function response: " + error.code + " — " + error.message;
        console.error(error);
      }
    });
  </script>
</body>
</html>
