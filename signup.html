
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medminder | Create Account</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e7f4eb, #f7fbf8);
      color: #203b2d;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #17563815;
    }

    .brand {
      text-align: center;
      color: #175638;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #66776b;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 17px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d4e2d8;
      border-radius: 9px;
      font-size: 15px;
      background: white;
      color: #203b2d;
    }

    input:focus, select:focus {
      outline: 2px solid #96d9b0;
      border-color: #175638;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #175638;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #10442b; }
    button:disabled { opacity: 0.65; cursor: wait; }

    .message {
      margin: 14px 0;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error { color: #b42318; }
    .success { color: #175638; }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    a { color: #175638; font-weight: bold; }

    @media (max-width: 480px) {
      body { padding: 14px; }
      .container { padding: 24px 19px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">Medminder</div>
    <p class="subtitle">Create your account to get started.</p>

    <form id="signupForm">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input id="firstName" type="text" autocomplete="given-name" required>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input id="lastName" type="text" autocomplete="family-name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="email"
               placeholder="you@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role" required>
          <option value="">Select account type</option>
          <option value="authorized">Authorized Person</option>
          <option value="patient">Patient</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="8"
               autocomplete="new-password" required>
        <small id="passwordStrength"></small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password"
               autocomplete="new-password" required>
      </div>

      <p id="formMessage" class="message" role="alert"></p>

      <button type="submit" id="submitButton">Create Account</button>
    </form>

    <p class="footer">
      Already have an account?
      <a href="index.html">Log in</a>
    </p>
  </main>

  <script type="module" src="js/signup.js"></script>
</body>
</html>
