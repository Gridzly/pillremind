
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#175638">
  <meta name="description" content="Log in to Medminder to manage medication reminders.">

  <title>Medminder | Log In</title>

  <style>
    :root {
      --green: #175638;
      --green-dark: #10442b;
      --green-light: #e7f4eb;
      --green-soft: #f4f8f5;
      --text: #24372b;
      --muted: #758178;
      --border: #e0e9e2;
      --white: #ffffff;
      --danger: #b42318;
      --success: #167344;
      --shadow: 0 4px 16px rgba(23, 86, 56, 0.045);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--green-soft);
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      display: flex;
      justify-content: center;
    }

    /* LOGIN CARD */

    .auth-card {
      width: 100%;
      padding: 30px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 17px;
      box-shadow: var(--shadow);
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-bottom: 27px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--green);
    }

    .brand-icon svg {
      width: 25px;
      height: 25px;
      display: block;
    }

    .brand h1 {
      color: var(--green);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .brand h1 span {
      color: #65a77e;
    }

    /* FORM HEADING */

    .form-heading {
      margin-bottom: 25px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
      padding: 7px 11px;
      color: var(--green);
      background: var(--green-light);
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .eyebrow svg {
      width: 15px;
      height: 15px;
    }

    .form-heading h2 {
      margin-bottom: 9px;
      color: var(--text);
      font-size: 27px;
      line-height: 1.25;
      letter-spacing: -0.7px;
      font-weight: 750;
    }

    .form-heading p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* FORM FIELDS */

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 13px;
      width: 18px;
      height: 18px;
      color: #83978a;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .form-group input {
      display: block;
      width: 100%;
      min-height: 45px;
      padding: 11px 13px 11px 40px;
      color: var(--text);
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input::placeholder {
      color: #a1ada5;
    }

    .form-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(23, 86, 56, 0.08);
    }

    /* PASSWORD */

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 70px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      z-index: 2;
      transform: translateY(-50%);
      min-width: 42px;
      padding: 7px 4px;
      color: var(--green);
      background: transparent;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .toggle-password:hover {
      color: var(--green-dark);
      background: var(--green-light);
    }

    .toggle-password:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

    /* FORGOT PASSWORD */

    .form-options {
      display: flex;
      justify-content: flex-end;
      margin-top: -2px;
      margin-bottom: 20px;
    }

    .text-button {
      padding: 0;
      color: var(--green);
      background: transparent;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .text-button:hover {
      color: var(--green-dark);
      text-decoration: underline;
    }

    /* FEEDBACK */

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.error,
    .message.success {
      display: block;
    }

    .message.error {
      color: var(--danger);
      background: #fff1f0;
      border: 1px solid #ffd6d2;
    }

    .message.success {
      color: var(--success);
      background: #edfaf1;
      border: 1px solid #ccebd6;
    }

    /* LOGIN BUTTON */

    .primary-button {
      width: 100%;
      min-height: 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 18px;
      color: var(--white);
      background: var(--green);
      border: 1px solid var(--green);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .primary-button:hover {
      background: var(--green-dark);
      border-color: var(--green-dark);
    }

    .primary-button:active {
      transform: scale(0.99);
    }

    .primary-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .primary-button svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* SIGNUP LINK */

    .switch-page {
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .signup-link {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-link:hover {
      color: var(--green-dark);
      text-decoration: underline;
    }

    /* SECURITY NOTE */

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .security-note svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--green);
    }

    /* COPYRIGHT */

    .copyright {
      width: 100%;
      margin-top: 20px;
      color: #91a096;
      font-size: 11px;
      text-align: center;
      flex-shrink: 0;
    }

    /* MOBILE */

    @media (max-width: 520px) {
      body {
        justify-content: flex-start;
        padding: 23px 14px;
      }

      .auth-container {
        max-width: 430px;
      }

      .auth-card {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .brand {
        margin-bottom: 23px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 11px;
      }

      .brand h1 {
        font-size: 23px;
      }

      .form-heading h2 {
        font-size: 25px;
      }

      .form-group input {
        min-height: 47px;
        font-size: 16px;
      }

      .primary-button {
        min-height: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="auth-container">
    <section class="auth-card" aria-labelledby="pageTitle">

      <!-- MEDMINDER BRAND -->
      <header class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 32 32" fill="none"
               xmlns="http://www.w3.org/2000/svg"
               role="img" aria-label="Medminder medical logo">
            <path
              d="M12 4.5h8v7.5h7.5v8H20v7.5h-8V20H4.5v-8H12V4.5Z"
              fill="#FFFFFF"
            />
          </svg>
        </div>

        <h1>Med<span>minder</span></h1>
      </header>

      <!-- FORM HEADING -->
      <div class="form-heading">
        <div class="eyebrow">
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <path d="m10 17 5-5-5-5"/>
            <path d="M15 12H3"/>
          </svg>
          WELCOME BACK
        </div>

        <h2 id="pageTitle">Welcome back!</h2>
        <p>Log in to your Medminder account.</p>
      </div>

      <!-- LOGIN MESSAGE -->
      <div
        id="loginMessage"
        class="message"
        role="alert"
        aria-live="polite">
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm">

        <!-- EMAIL -->
        <div class="form-group">
          <label for="loginEmail">Email address</label>

          <div class="input-wrap">
            <svg class="input-icon"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>

            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="loginPassword">Password</label>

          <div class="input-wrap password-field">
            <svg class="input-icon"
                 viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>

            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              data-target="loginPassword"
              aria-label="Show password"
              aria-pressed="false">
              Show
            </button>
          </div>
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="form-options">
          <button
            type="button"
            class="text-button"
            id="forgotPasswordButton">
            Forgot password?
          </button>
        </div>

        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          class="primary-button"
          id="loginSubmit">

          <span>Log In</span>

          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </button>

      </form>

      <!-- SIGNUP LINK -->
      <p class="switch-page">
        Don't have an account?
        <a href="signup.html" class="signup-link">Sign up</a>
      </p>

      <!-- SECURITY NOTE -->
      <p class="security-note">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>

        Your account is protected by Firebase Authentication.
      </p>

    </section>
  </main>

  <!-- COPYRIGHT -->
  <p class="copyright">
    © <span id="currentYear"></span> Medminder. Your medication, organized.
  </p>

  <!-- PAGE INTERACTIONS -->
  <script>
    // CURRENT YEAR
    const currentYear = document.getElementById("currentYear");

    if (currentYear) {
      currentYear.textContent = new Date().getFullYear();
    }

    // CLEAR LOGIN MESSAGE WHEN EDITING
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginMessage = document.getElementById("loginMessage");

    function clearLoginMessage() {
      if (loginMessage) {
        loginMessage.textContent = "";
        loginMessage.className = "message";
      }
    }

    loginEmail?.addEventListener("input", clearLoginMessage);
    loginPassword?.addEventListener("input", clearLoginMessage);
  </script>

  <!-- FIREBASE LOGIN -->
  <script type="module" src="./js/login.js"></script>

</body>
</html>
