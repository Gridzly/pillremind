<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#175638">
  <meta name="description" content="Log in to Medminder to manage medication reminders.">
  <title>Medminder | Log In</title>

  <style>
    :root {
      --green: #175638;
      --green-dark: #10442b;
      --green-light: #e7f4eb;
      --background: #f2f7f3;
      --text: #203b2d;
      --muted: #78867d;
      --border: #dce7df;
      --white: #ffffff;
      --error: #b42318;
      --error-bg: #fef3f2;
      --success: #176b3a;
      --success-bg: #ecfdf3;
      --shadow: 0 15px 45px rgba(23, 86, 56, 0.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(150, 217, 176, 0.20), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(23, 86, 56, 0.07), transparent 35%),
        var(--background);
    }

    button,
    input {
      font: inherit;
    }

    .auth-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 38px;
      background: var(--white);
      border: 1px solid #e8eee9;
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 66px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      border-radius: 19px;
      background: var(--green-light);
    }

    .brand-icon svg {
      width: 45px;
      height: 45px;
      display: block;
    }

    .brand h1 {
      margin-bottom: 7px;
      color: var(--green);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .form-heading {
      margin-bottom: 24px;
    }

    .form-heading h2 {
      margin-bottom: 8px;
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    .form-heading p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-group label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 14px;
      color: var(--text);
      background: #fcfdfc;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input::placeholder {
      color: #a2ada5;
    }

    .form-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(23, 86, 56, 0.10);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      padding-right: 68px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 13px;
      transform: translateY(-50%);
      padding: 5px 0;
      color: var(--green);
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--green-dark);
    }

    .form-options {
      display: flex;
      justify-content: flex-end;
      margin-top: -3px;
      margin-bottom: 21px;
    }

    .text-button {
      padding: 0;
      color: var(--green);
      background: transparent;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .text-button:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-bottom: 17px;
      padding: 11px 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message:not(:empty) {
      display: block;
    }

    .message.error {
      color: var(--error);
      background: var(--error-bg);
      border: 1px solid #fecdca;
    }

    .message.success {
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid #abefc6;
    }

    .primary-button {
      width: 100%;
      min-height: 49px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 18px;
      color: var(--white);
      background: var(--green);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .primary-button:hover {
      background: var(--green-dark);
    }

    .primary-button:active {
      transform: scale(0.99);
    }

    .primary-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .primary-button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .switch-page {
      margin-top: 23px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
    }

    .signup-link {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-link:hover {
      color: var(--green-dark);
      text-decoration: underline;
    }

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .security-note svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--green);
    }

    .copyright {
      margin-top: 23px;
      color: #91a096;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding: 22px 13px;
      }

      .auth-card {
        padding: 29px 22px;
        border-radius: 18px;
      }

      .brand {
        margin-bottom: 25px;
      }

      .brand-icon {
        width: 60px;
        height: 60px;
        border-radius: 17px;
      }

      .brand h1 {
        font-size: 25px;
      }

      .form-heading h2 {
        font-size: 22px;
      }

      .form-group input {
        min-height: 49px;
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>

  <script type="module" src="js/login.js"></script>
</head>

<body>
  <main class="auth-container">
    <section class="auth-card" aria-labelledby="pageTitle">

      <header class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 64 64" fill="none"
               xmlns="http://www.w3.org/2000/svg"
               role="img" aria-label="Medicine capsule with a checkmark">
            <rect x="17" y="8" width="30" height="48" rx="15"
                  transform="rotate(35 32 32)"
                  fill="#175638"/>
            <path d="M19 19L45 37"
                  stroke="#FFFFFF"
                  stroke-width="2.5"
                  opacity="0.8"/>
            <path d="M24 34L29 39L40 27"
                  stroke="#FFFFFF"
                  stroke-width="4"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
        </div>

        <h1>Medminder</h1>
        <p>Your trusted partner for medication reminders.</p>
      </header>

      <div class="form-heading">
        <h2 id="pageTitle">Welcome back!</h2>
        <p>Log in to your Medminder account.</p>
      </div>

      <div id="loginMessage" class="message"
           role="alert" aria-live="polite"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email address</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-field">
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required>

            <button
              type="button"
              class="toggle-password"
              data-target="loginPassword"
              aria-label="Show password">
              Show
            </button>
          </div>
        </div>

        <div class="form-options">
          <button
            type="button"
            class="text-button"
            id="forgotPasswordButton">
            Forgot password?
          </button>
        </div>

        <button type="submit"
                class="primary-button"
                id="loginSubmit">
          <span>Log In</span>
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </form>

      <p class="switch-page">
        Don't have an account?
        <a href="signup.html" class="signup-link">Sign up</a>
      </p>

      <p class="security-note">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        Your account is protected by Firebase Authentication.
      </p>
    </section>
  </main>

  <script>
    // Show or hide the login password.
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        if (!input) return;

        const showPassword = input.type === "password";
        input.type = showPassword ? "text" : "password";
        button.textContent = showPassword ? "Hide" : "Show";
        button.setAttribute(
          "aria-label",
          showPassword ? "Hide password" : "Show password"
        );
      });
    });

    // Clear login messages when the user edits the form.
    const loginEmail = document.getElementById("loginEmail");
    const loginPassword = document.getElementById("loginPassword");
    const loginMessage = document.getElementById("loginMessage");

    function clearLoginMessage() {
      loginMessage.textContent = "";
      loginMessage.className = "message";
    }

    loginEmail.addEventListener("input", clearLoginMessage);
    loginPassword.addEventListener("input", clearLoginMessage);
  </script>
</body>
</html>
